[MLP]

# ================================
# Neural network hyperparameters
# ================================

latent_dim = 99
no_kms     = 1098
n_samples  = 100

layer_1 = 1024
layer_2 = 1024
layer_3 = 2048


# ==========================================================================================================

[PATHS]

# ================================
# METABOLIC MODEL SETTINGS
# ================================

# Model ID (used only for documentation)
met_model = s_cerevisiae

# ---- Model data (explicit paths) ----
model_root   = latent_analysis/models/s_cerevisiae

param_names   = latent_analysis/models/s_cerevisiae/parameter_names_km_s_cere.pkl
thermo_file   = latent_analysis/models/s_cerevisiae/thermo/constraint_based_model_scaffold.json
kinetics_file = latent_analysis/models/s_cerevisiae/kinetic/kinetic_model_scaffold.yaml
ss_file       = latent_analysis/models/s_cerevisiae/steady_state_samples/steady_states.csv

# ---- Experiment output ----
experiment_root = latent_analysis/output/km-18to2_decay99



[CONSTRAINTS]

# log(Km) bounds (taken from BRENDA)
min_km = -18
max_km = 2

[EVOSTRAT]
# Number of statistical repeats
repeats = 1
# Saving step (How often to save weights during optimisation process)
save_step = 1 
# Number og evolution generations
generations = 100
# Population size of generators
pop_size = 20
# Noise (Search Radius)
noise = 0.01
# Learning rate
lr = 1e-3
#learning rate decay per generation (0.95 means 5% decay per gen)
decay = 0.99
# Index of the steady state to generate kinetic models around (there are 5000 steady states in the data provided)
ss_idx = 3191
# Number of threads
n_threads = 32

[REWARDS]
# Desired optimisation objective ( Flag 0 - Push for max incidince of valid models; Flag 1 - Push for fastest dynamic possible)
reward_flag = 1
# Number of fastest eigenvalues to consider when Flag = 1
n_consider  = 30
# eigenvalue partition between valid and invalid models
eig_partition = -0.1

[PARAMETER_FIXING]
# Parameter fixing flag ( 1 - Enabled/ 0 - Disabled)
pf_flag = 0




# ==========================================================================================================

[DEFAULT]

generator_id = 62
experiment_root = latent_analysis/output/km-18to2_decay99

# ==========================================================================================================


[LOAD_AND_GENERATE]

# path to saved weights 
path_to_weights = latent_analysis/output/km-18to2_decay99/training/training_repeat_0/weights_%(generator_id)s.pkl

# Number of parameter sets to generate (1 million sets takes ~20s)
n_sets = 500
# Output path yo save as .hdf5 format
path_output = latent_analysis/output/km-18to2_decay99/iter62/samples_test/

# Output name 
name_output = 500_sampled_params
# 1: used input noise vector / latent vector for every sample is saved / 0: used vector not saved
save_latent_vectors = 1
# bool wether to sqave unscaled versions of the generated parameters (1: save unscaled / 0: do not save)
save_unscaled = 1


# ==========================================================================================================


[LATENT_ANALYSIS]

threshold      = -0.4
n_sets_sampled = 500

#seed_latent_vectors = [
#        [496, 407, 288], # 40s
#        [366, 265, 192],  # 62
#        [341, 495, 167], # 94

seed_latent_vectors = 191

output_folder_3_point_analysis = 3_point_analysis/run_6


base_output = %(experiment_root)s

iter_folder     = %(experiment_root)s/sampling/iter%(generator_id)s

samples_foler     = %(experiment_root)s/sampling/iter%(generator_id)s
weights_folder  = %(experiment_root)s/training/training_repeat_0
analysis_folder = %(experiment_root)s/latent_analysis


# =====================================================
# INPUT DATA PATHS
# =====================================================

unscaled_sampled_parametersets_path = %(samples_foler)s/samples/500_sampled_params_unscaled.npy
max_eigen_path                      = %(samples_foler)s/samples/500_sampled_params_max_eig.csv
latent_vectors_path                 = %(samples_foler)s/samples/500_sampled_params_latent.npy
generator_weights_path              = %(weights_folder)s/weights_%(generator_id)s.pkl
